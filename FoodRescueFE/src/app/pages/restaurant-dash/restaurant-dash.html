<div class="container mt-3">

  <div class="row">
    
    <div class="col-md-3 mb-3" *ngFor="let food of foods()">

      <div class="card">
    

        <div class="card-body">
          <h5 class="card-title">{{ food.foodName }}</h5>

          <p class="card-text">
            🍽 Quantity: {{ food.quantity }} <br>
            📍 Location: {{ food.location }} <br>
            ⏳ {{ getRemainingTime(food.expiryTime) }}
          </p>

          <button class="btn btn-primary">
            View Details
          </button>
        </div>
      </div>

    </div>

  </div>
  <button class="btn btn-success mb-3" (click)="openForm()">
  ➕ Add Food
</button>
<div class="overlay" *ngIf="showForm()">
  <div class="form-box">

    <h3>Add Food</h3>
<div class="form-group">
  <label>Food Name</label>
  <input type="text"
    [ngModel]="newFood().foodName"
    (ngModelChange)="newFood.set({...newFood(), foodName: $event})">
</div>

<div class="form-group">
  <label>Quantity</label>
  <input type="number"
    [ngModel]="newFood().quantity"
    (ngModelChange)="newFood.set({...newFood(), quantity: $event})">
</div>

<div class="form-group">
  <label>Expiry Time</label>
  <input type="datetime-local"
    [ngModel]="newFood().expiryTime"
    (ngModelChange)="newFood.set({...newFood(), expiryTime: $event})">
</div>

<div class="form-group">
  <label>Location</label>
  <input type="text"
    [ngModel]="newFood().location"
    (ngModelChange)="newFood.set({...newFood(), location: $event})">
</div>
    <div class="actions">
      <button class="btn btn-primary" (click)="submitFood()">Submit</button>
      <button class="btn btn-danger" (click)="closeForm()">Cancel</button>
    </div>

  </div>
</div>
</div>
